[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbrain"
version = "0.1.0"
description = "Creator Brain: turn any YouTube creator into an Obsidian knowledge vault that every AI agent can build, search and keep updated."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "yt-dlp>=2026.10.0",
  "aiohttp>=3.9",
  "aiohttp-socks>=0.9",
  "mcp>=1.2",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
brain = "cbrain.cli:main"
brain-mcp = "cbrain.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["cbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
